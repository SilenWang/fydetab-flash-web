<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbfbfc" />
    <title>Fydetab Duo 刷写工具</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="appbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 5 14h6l-1 8 8-12h-6l1-8Z" />
          </svg>
        </span>
        <span class="brand-name">Fydetab Duo 刷写</span>
      </div>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <main id="main" class="page">
      <section class="card card-image" aria-labelledby="h-image">
        <h2 id="h-image">选择系统</h2>

        <div id="image-choices" class="choices">
          <p class="muted">正在读取版本…</p>
        </div>

        <div class="file-row">
          <span class="file-name" id="image-label">或使用本地镜像</span>
          <button id="btn-pick-image" class="btn ghost small" type="button">选择文件</button>
          <input id="file-image" type="file" accept=".img,.bin,.zip,application/octet-stream,application/zip" />
        </div>

        <div id="download-progress" class="progress" hidden>
          <div class="track"><span id="download-bar" class="fill"></span></div>
          <div class="progress-row">
            <p id="download-text" class="progress-text"></p>
            <span class="progress-actions">
              <button id="btn-download-cancel" class="btn ghost small" type="button">取消</button>
              <a id="download-fallback" class="link" target="_blank" rel="noreferrer" hidden>在新标签页下载</a>
            </span>
          </div>
        </div>

        <div id="verify-progress" class="progress" hidden>
          <div class="track small"><span id="verify-bar" class="fill"></span></div>
          <p id="verify-progress-text" class="progress-text"></p>
        </div>

        <p id="image-summary" class="note" hidden></p>
        <p id="fsa-note" class="note"></p>
      </section>

      <section class="card card-device" aria-labelledby="h-device">
        <div class="card-head">
          <h2 id="h-device">设备</h2>
          <span class="spacer"></span>
          <button id="btn-refresh" class="btn ghost small" type="button" hidden>刷新</button>
          <button id="btn-authorize" class="btn secondary small" type="button">连接设备</button>
        </div>

        <div id="devices" class="devices"></div>
        <p id="device-selected" class="note"></p>

        <div id="reconnect" class="reconnect" hidden>
          <p class="reconnect-title">设备已断开</p>
          <ol id="reconnect-steps"></ol>
          <div class="row-actions">
            <button id="btn-reconnect-auth" class="btn secondary small" type="button">重新连接</button>
            <button id="btn-reconnect-dismiss" class="btn ghost small" type="button">稍后</button>
          </div>
        </div>

        <div id="write-block" class="write-block">
          <ul id="checklist" class="checks gates" hidden></ul>

          <div id="erase-row" class="erase-row" hidden>
            <p id="erase-title" class="erase-title"></p>
            <div class="erase-controls">
              <select id="erase-mode" aria-label="没覆盖到的空间怎么处理">
                <option value="none">保持原样</option>
                <option value="fill">填 0xFF</option>
                <option value="erase-lba">整段擦除</option>
              </select>
              <label class="check-inline">
                <input id="chk-erase-confirm" type="checkbox" />
                <span>就按这个处理</span>
              </label>
            </div>
          </div>

          <div id="write-failure" class="failure" hidden>
            <strong id="write-failure-title">刷写失败</strong>
            <p id="write-failure-detail"></p>
            <ol id="write-failure-steps"></ol>
          </div>
        </div>
      </section>

      <section class="card card-log" aria-labelledby="h-log">
        <div class="card-head">
          <h2 id="h-log">日志</h2>
          <span id="log-count" class="note"></span>
          <span class="spacer"></span>
          <button id="btn-export-log" class="btn ghost small" type="button">导出</button>
          <button id="btn-toggle-log" class="btn ghost small" type="button" aria-expanded="false">展开</button>
        </div>
        <div id="log-body" class="log-body" hidden>
          <ol id="log-lines" class="log-lines" aria-live="polite"></ol>
          <p id="log-empty" class="muted">还没有记录。</p>
        </div>
      </section>

      <footer class="page-foot">
        <p>
          仅支持 Fydetab Duo（RK3588）·
          <a href="https://github.com/rockchip-linux/rkdeveloptool" target="_blank" rel="noreferrer">rkdeveloptool</a>（GPL-2.0）
        </p>
        <p class="foot-actions">
          <button id="btn-install" class="btn ghost small" type="button" hidden>安装到桌面</button>
          <button id="btn-reload-app" class="btn ghost small" type="button" hidden>刷新页面</button>
          <span id="install-note" class="note"></span>
        </p>
      </footer>
    </main>

    <div class="actionbar">
      <div class="action-progress" id="write-progress" hidden>
        <div class="track"><span id="write-bar" class="fill"></span></div>
      </div>
      <div class="action-inner">
        <div class="action-summary">
          <span id="action-image" class="action-label">未选择镜像</span>
          <span id="action-device" class="action-sub">未连接设备</span>
          <p id="write-progress-text" class="action-sub" hidden></p>
        </div>
        <div class="action-buttons">
          <button id="btn-cancel-write" class="btn ghost" type="button" disabled hidden>取消</button>
          <button id="btn-write" class="btn primary lg" type="button" disabled>开始刷写</button>
        </div>
      </div>
    </div>

    <dialog id="version-dialog" class="dialog">
      <div class="dialog-head">
        <h2 id="version-title">选择版本</h2>
        <button id="btn-close-versions" class="btn ghost small" type="button">关闭</button>
      </div>
      <ul id="version-list" class="versions"></ul>
    </dialog>

    <span id="sw-note" class="sr-only"></span>

    <script type="module" src="./app.js"></script>
  </body>
</html>
