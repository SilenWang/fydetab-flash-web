[workspace]
authors = ["Sylens Wong <silenseek14@gmail.com>"]
channels = ["conda-forge"]
name = "rk3588-webflasher"
platforms = ["linux-64", "osx-64", "osx-arm64"]
version = "0.1.0"

[tasks]
# Regenerate web/probe/protocol.js and web/app/protocol.js from internal/rockusb
# (single source of truth).
gen = "go run ./cmd/genprotocol"
# Build the Go/WASM core into web/app/wasm/ and copy the toolchain's matching
# wasm_exec.js next to it.
wasm = "node tools/build-wasm.mjs"
# Serve the static pages on http://localhost:5173 (WebUSB secure context):
# /app/ is the M1 tool, /probe/ is the M0 read-only probe.
dev = { cmd = "node tools/serve.mjs web 5173", depends-on = ["gen", "wasm"] }
# Everything CI needs: generated JS is current, Go compiles+vet (host + wasm),
# JS parses.
build = { cmd = "go run ./cmd/genprotocol -check && go build ./... && go vet ./... && node --check web/app/protocol.js && node --check web/app/bridge.js && node --check web/app/mock-host.js && node --check web/app/mock-loader.js && node --check web/app/usb-host.js && node --check web/app/worker.js && node --check web/app/app.js && node --check web/probe/protocol.js && node --check web/probe/rockusb.js && node --check web/probe/probe.js && node --check tools/serve.mjs && node --check tools/build-wasm.mjs", depends-on = ["gen", "wasm"] }
test = { cmd = "go test ./... && node --test web/probe/rockusb.test.mjs web/probe/probe.test.mjs web/app/test/bridge.test.mjs web/app/test/mock-host.test.mjs web/app/test/usb-host.test.mjs web/app/test/core.test.mjs web/app/test/worker.test.mjs", depends-on = ["wasm"] }
fmt = "go fmt ./..."

[dependencies]
go = ">=1.22"
nodejs = ">=20"
